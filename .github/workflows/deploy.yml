name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  test-backend:
    name: Run Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          
      - name: Run Maven Tests
        run: |
          cd backend
          mvn clean test

  test-frontend:
    name: Run Frontend Component Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Vitest
        run: |
          cd frontend
          npx vitest run

  test-e2e:
    name: Run Full UI E2E Tests (MS SQL)
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "StrongPassword123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'StrongPassword123!' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Build Backend
        run: |
          cd backend
          mvn clean package -DskipTests

      - name: Start Backend with MS SQL
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_HOST: 127.0.0.1
          DB_PORT: 1433
          DB_NAME: master
          DB_USERNAME: sa
          DB_PASSWORD: StrongPassword123!
          DB_ENCRYPT: false
          DB_TRUST_CERT: true
          JWT_SECRET: super-secret-e2e-test-key-needs-to-be-at-least-32-chars!
        run: |
          cd backend
          java -jar target/*.jar &
          npx wait-on tcp:8080 -t 90000

      - name: Install Frontend Dependencies & Playwright
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium

      - name: Start Frontend
        run: |
          cd frontend
          npm run dev &
          npx wait-on tcp:5173 -t 60000

      - name: Run Full UI E2E Tests
        env:
          HEADLESS: 1
          BASE_URL: http://localhost:5173
        run: |
          cd frontend
          npm run e2e:full-ui

  build-and-push:
    name: Build and Push Docker Images
    needs: test-e2e
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sacl-backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sacl-frontend:latest

  # Uncomment the block below if you want GitHub Actions to automatically SSH into your server
  # and run the deployment script. You will need to add SERVER_HOST, SERVER_USER, and SERVER_SSH_KEY to your secrets.
  
