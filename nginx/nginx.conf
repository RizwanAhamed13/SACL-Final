events {
    worker_connections 1024;
}

http {
    upstream backend_servers {
        server backend:8080;
        # In a real blue/green or multi-replica setup, we would list multiple instances
        # server backend_blue:8080;
        # server backend_green:8080;
    }

    server {
        listen 80;
        
        # Route API requests to the Spring Boot backend
        location /api/ {
            proxy_pass http://backend_servers/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route frontend traffic to the Vite React app
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
