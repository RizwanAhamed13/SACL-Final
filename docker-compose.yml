version: '3.8'

# ── SACL Quality Management System ─────────────────────────────
# Client deployment — just run: docker compose pull && docker compose up -d
# Access: http://<server-ip>  (port 80)
# Frontend Nginx proxies /api/* → backend internally (no backend port exposed)
# DB: External SQL Server (no DB container needed)
# ────────────────────────────────────────────────────────────────

services:
  backend:
    build: ./backend
    image: rizwanahamed13/sacl-backend:latest
    container_name: sacl-backend
    restart: always
    # No host port — only reachable from within the Docker network via frontend proxy
    expose:
      - "8080"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    image: rizwanahamed13/sacl-frontend:latest
    container_name: sacl-frontend
    restart: always
    expose:
      - "80"
    depends_on:
      - backend

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
