version: '3.8'

# ── SACL Quality Management System ─────────────────────────────
# Client deployment — just run: docker compose pull && docker compose up -d
# Ports: 9201 → Frontend  |  9202 → Backend
# DB: External SQL Server (no DB container needed)
# ────────────────────────────────────────────────────────────────

services:

  backend:
    image: rizwanahamed13/sacl-backend:latest
    container_name: sacl-backend
    restart: always
    ports:
      - "9202:8080"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: rizwanahamed13/sacl-frontend:latest
    container_name: sacl-frontend
    restart: always
    ports:
      - "9201:80"
    depends_on:
      - backend
