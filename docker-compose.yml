version: '3.8'

# ── SACL Quality Management System ─────────────────────────────
# Client deployment — just run: docker compose pull && docker compose up -d
# Access: http://<server-ip>  (port 80)
# Frontend Nginx proxies /api/* → backend internally (no backend port exposed)
# DB: External SQL Server (no DB container needed)
# ────────────────────────────────────────────────────────────────

services:

  backend:
    image: rizwanahamed13/sacl-backend:latest
    container_name: sacl-backend
    restart: always
    # No host port — only reachable from within the Docker network via frontend proxy
    expose:
      - "8080"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: rizwanahamed13/sacl-frontend:latest
    container_name: sacl-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
