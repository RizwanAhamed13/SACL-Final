version: '3.8'

# Ports:  9201 → Frontend   |   9202 → Backend
# DB: External SQL Server (192.168.7.75) — NOT in Docker
# Credentials loaded from .env file (never committed to git)

services:

  backend:
    build: ./backend
    container_name: sacl-backend
    restart: always
    ports:
      - "9202:8080"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    container_name: sacl-frontend
    restart: always
    ports:
      - "9201:80"
    depends_on:
      - backend
