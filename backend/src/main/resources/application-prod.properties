# ── PRODUCTION — MS SQL SERVER ──────────────────────────────────
# Client only needs to provide: DB_HOST, DB_NAME, DB_USERNAME, DB_PASSWORD
# Everything else has safe defaults

# Database connection
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME};encrypt=${DB_ENCRYPT:false};trustServerCertificate=${DB_TRUST_CERT:false};
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate — SQL Server 2025
# SQLServerDialect auto-detects version, works for 2012, 2016, 2019, 2022, 2025
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ddl-auto=update on a FRESH empty database:
#   - Creates all tables automatically on first startup
#   - Client just provides the DB name — nothing else to do
#   - On every subsequent restart: only ADDS missing columns, NEVER drops or changes anything
#   - Completely safe — no data loss, no schema corruption
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Security — must be set, no default allowed in prod
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:36000000}

# CORS — set to your frontend domain
cors.allowed-origins=${CORS_ORIGINS}

# Logging
spring.jpa.show-sql=false
logging.level.root=WARN
logging.level.com.sacl=INFO
logging.level.org.hibernate.SQL=WARN
