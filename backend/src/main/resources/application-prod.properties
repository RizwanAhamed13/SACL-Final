# ── PRODUCTION PROFILE (MS SQL SERVER) ─────────────────────────
# Run with: -Dspring.profiles.active=prod
# In Docker:  SPRING_PROFILES_ACTIVE=prod  (env var)

# --- Fill these in your .env or docker-compose environment: ---
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=sacl_quality;encrypt=true;trustServerCertificate=true;}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:YourStrong!Pass123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect

# Disable show-sql in production
spring.jpa.show-sql=false

# Use validate instead of update once schema is stable
# spring.jpa.hibernate.ddl-auto=validate
