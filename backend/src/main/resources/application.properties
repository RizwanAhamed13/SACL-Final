spring.application.name=sacl-quality

# Default to dev profile (PostgreSQL). Override: -Dspring.profiles.active=prod
spring.profiles.default=dev

# JWT
jwt.secret=${JWT_SECRET:dev-only-secret-change-in-production-must-be-at-least-64-chars-long!!}
jwt.expiration=${JWT_EXPIRATION_MS:36000000}

# CORS
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# JPA common
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.open-in-view=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.prometheus.metrics.export.enabled=true

# Server
server.port=8080
